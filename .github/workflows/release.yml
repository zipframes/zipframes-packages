# Version and publish the @zipframes/* packages.
#
# On every push to main:
#   - if this push carries no changeset yet, one is generated from its feat
#     and fix commits (.github/scripts/generate-changeset.mjs) and committed
#     straight to main. A changeset added by hand in the merged PR always
#     wins: this step only runs when none is found. chore, refactor, test
#     and docs do not open a version on their own. The "chore: version
#     packages" commit is not a feat or a fix, so merging the Version
#     Packages PR does not open another one. Pushing with the default
#     GITHUB_TOKEN does not trigger another workflow run, so committing the
#     changeset cannot loop.
#   - changesets/action then checks for pending changesets:
#       - if there are any, it opens or updates a "Version Packages" PR with
#         the computed versions and changelog;
#       - once that PR is merged, this workflow runs again, finds no pending
#         changesets, and publishes the versions it just merged to GitHub
#         Packages instead.
#
# The same feat/fix gate is used on main and on an open pull request. A
# merge that already brought a changeset does not generate another one.
# Something that reaches main without a changeset — a direct push, for
# example — gets one only when a feat or fix commit touched a package.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zipframes"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for an existing changeset
        id: existing
        run: |
          count=$(ls .changeset/*.md 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Generate a changeset from this push's commits
        if: steps.existing.outputs.count == '0'
        id: generated
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="HEAD~1"
          fi
          node .github/scripts/generate-changeset.mjs --from "$before" --to "${{ github.sha }}"

      - name: Commit the generated changeset
        if: steps.generated.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.generated.outputs.path }}"
          git commit -m "chore(changeset): add changeset for ${{ github.sha }}"
          git push origin HEAD:main

      - name: Build packages
        run: pnpm turbo run build --filter=./packages/*

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
