# Version and publish the @zipframes/* packages.
#
# On every push to main:
#   - if this push carries no changeset yet, one is generated for every
#     package the push changed (.github/scripts/generate-changeset.mjs
#     --any-package-change) and committed straight to main. feat stays
#     minor, fix stays patch, and a breaking marker stays major. chore,
#     refactor, test and any other commit that touches a package still get
#     a patch. A changeset added by hand in the merged PR always wins: this
#     step only runs when none is found. The "chore: version packages"
#     commit is ignored, so merging the Version Packages PR does not open
#     another one. Pushing with the default GITHUB_TOKEN does not trigger
#     another workflow run, so committing the changeset cannot loop.
#   - changesets/action then checks for pending changesets:
#       - if there are any, it opens or updates a "Version Packages" PR with
#         the computed versions and changelog;
#       - once that PR is merged, this workflow runs again, finds no pending
#         changesets, and publishes the versions it just merged to GitHub
#         Packages instead.
#
# The feat/fix gate lives only in the prerelease workflow, on pushes to an
# open pull request. A merge to main always versions the packages it
# changed. For a feat/fix PR the changeset is usually already on the branch,
# so this fallback does not run. It does run for chore, refactor and test,
# and for anything else that reaches main without a changeset.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zipframes"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for an existing changeset
        id: existing
        run: |
          count=$(ls .changeset/*.md 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Generate a changeset from this push's commits
        if: steps.existing.outputs.count == '0'
        id: generated
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="HEAD~1"
          fi
          node .github/scripts/generate-changeset.mjs --from "$before" --to "${{ github.sha }}" --any-package-change

      - name: Commit the generated changeset
        if: steps.generated.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.generated.outputs.path }}"
          git commit -m "chore(changeset): add changeset for ${{ github.sha }}"
          git push origin HEAD:main

      - name: Build packages
        run: pnpm turbo run build --filter=./packages/*

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
