# Publishes a snapshot version of the packages a pull request changes, so
# they can be installed and tested before it merges.
#
# A snapshot is published when either is true:
#   - the commits pushed since the last run (all of them, on the first run)
#     include a feat or fix touching a package;
#   - the push added a changeset by hand (`pnpm changeset`), which always
#     wins over the automatic one below.
# Anything else — a chore, a doc fix, an amended commit message — publishes
# nothing: the previous snapshot, if any, is still there to test.
#
# When it does publish, the changeset behind it is generated from the PR's
# feat and fix commits (.github/scripts/generate-changeset.mjs) into a single
# file, auto-pr-<number>.md, recomputed from the whole PR every time so it
# never misses a package a later commit touched. That file is committed
# straight to the PR branch, so it merges into main with the rest of the PR
# and the release workflow finds it already there. A PR that never earned a
# changeset does not get one on main either, unless a feat or fix touched a
# package. A changeset added by hand is never touched or duplicated.
#
# `changeset version --snapshot` also rewrites dependents whose range cannot
# accept the new version. Those packages did not change. Before publish, the
# workflow restores their manifests, so the dist-tag only moves for packages
# named in the changeset.
#
# This feat/fix gate applies to an open pull request and to main.
#
# The snapshot version looks like 0.1.0-pr7-20260101120000: the real next
# version, the PR number, and a timestamp. It publishes under the `pr7`
# dist-tag, never `latest`, and none of this consumes the real changeset or
# bumps the committed package.json — the actual version is still decided by
# the normal release flow when the PR merges.
name: prerelease

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  snapshot:
    name: Publish snapshot
    runs-on: ubuntu-latest
    # Forks don't carry the token this job needs to publish, and shouldn't be
    # trusted with one. Their PRs simply don't get a snapshot.
    #
    # The "Version Packages" PR that changesets/action opens is also
    # excluded: by the time it exists, the pending changesets have already
    # been consumed into version bumps, so there is nothing left to snapshot,
    # and `changeset version --snapshot` would just fail on an empty queue.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # actions/checkout only creates a local branch for the ref it checks
      # out (the PR branch). changesets reads `baseBranch` from
      # .changeset/config.json ("main") as a literal local branch name for
      # `git merge-base`, so without this, every command that needs to
      # diff against main fails with "Failed to find where HEAD diverged
      # from main", even though origin/main exists.
      - name: Ensure a local main branch exists for changesets to diff against
        run: git branch main origin/main

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@zipframes"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decide whether this push deserves a snapshot
        id: gate
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          number="${{ github.event.pull_request.number }}"
          auto_file=".changeset/auto-pr-${number}.md"

          before="${{ github.event.before }}"
          if [ "${{ github.event.action }}" != "synchronize" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$base"
          fi

          has_manual=false
          if git diff --name-only "origin/main...HEAD" -- '.changeset/*.md' \
              | grep -vxF "$auto_file" | grep -q .; then
            has_manual=true
          fi

          has_new_conventional=false
          rm -rf /tmp/gate-check && mkdir -p /tmp/gate-check
          node .github/scripts/generate-changeset.mjs \
            --from "$before" --to "${{ github.event.pull_request.head.sha }}" \
            --out-dir /tmp/gate-check --filename probe.md
          if [ -f /tmp/gate-check/probe.md ]; then
            has_new_conventional=true
          fi

          if [ "$has_manual" = true ] || [ "$has_new_conventional" = true ]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "has-manual=$has_manual" >> "$GITHUB_OUTPUT"
          echo "auto-file=$auto_file" >> "$GITHUB_OUTPUT"

      - name: Regenerate the automatic changeset for this PR
        if: steps.gate.outputs.should-release == 'true' && steps.gate.outputs.has-manual == 'false'
        run: |
          node .github/scripts/generate-changeset.mjs \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --out-dir .changeset \
            --filename "auto-pr-${{ github.event.pull_request.number }}.md"

      - name: Commit the automatic changeset
        if: steps.gate.outputs.should-release == 'true' && steps.gate.outputs.has-manual == 'false'
        run: |
          auto_file="${{ steps.gate.outputs.auto-file }}"

          # `git diff --quiet` alone ignores untracked files, so it reports
          # "no change" the very first time this file is created — staging it
          # first makes the comparison (index vs HEAD) see the addition too,
          # not just later edits to an already-tracked file.
          git add "$auto_file"
          if git diff --cached --quiet -- "$auto_file"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(changeset): update changeset for PR #${{ github.event.pull_request.number }}"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Build packages
        if: steps.gate.outputs.should-release == 'true'
        run: pnpm turbo run build --filter=./packages/*

      - name: Remember changeset package names
        if: steps.gate.outputs.should-release == 'true'
        run: node .github/scripts/changeset-packages.mjs --list > /tmp/changeset-package-names.txt

      - name: Version as a snapshot
        if: steps.gate.outputs.should-release == 'true'
        run: pnpm exec changeset version --snapshot pr${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the snapshot limited to packages the changeset names
        if: steps.gate.outputs.should-release == 'true'
        run: node .github/scripts/changeset-packages.mjs --restore-others --from-file /tmp/changeset-package-names.txt

      - name: Publish snapshot
        if: steps.gate.outputs.should-release == 'true'
        run: |
          pnpm exec changeset publish --tag pr${{ github.event.pull_request.number }}
          node .github/scripts/changeset-packages.mjs --summary > snapshot-summary.md
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on the pull request
        if: steps.gate.outputs.should-release == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const list = fs.readFileSync("snapshot-summary.md", "utf8");
            const marker = "<!-- prerelease-snapshot -->";
            const body = [
              marker,
              "**Snapshot published for this PR.** Install it to test before merging:",
              "",
              list,
              "",
              "It won't be promoted by merging this PR: the changeset committed here goes in as-is, and the real version is decided by the normal release flow.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
